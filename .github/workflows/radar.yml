name: radar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request,urllib.parse,datetime,shutil,time
          TOK=os.environ.get('GH_TOKEN','')
          def api(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+TOK,'User-Agent':'radar','Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req,timeout=30))
          today=datetime.date.today()
          D1=(today-datetime.timedelta(days=1)).isoformat()
          D7=(today-datetime.timedelta(days=7)).isoformat()
          D30=(today-datetime.timedelta(days=30)).isoformat()
          D90=(today-datetime.timedelta(days=90)).isoformat()
          def s(q):
              try:
                  d=api('https://api.github.com/search/repositories?q='+q+'&sort=stars&order=desc&per_page=100')
                  return [{'r':i['full_name'],'d':(i['description'] or '')[:120],'s':i['stargazers_count'],'l':i['language'] or '','f':i['forks_count'],'i':i['open_issues_count'],'u':i['html_url']} for i in d.get('items',[])]
              except Exception as e:
                  print('search failed',q,e); return []
          T='created:>'+D30+'+stars:>=100+'
          boards={
           'daily':  s('created:>'+D1+'+stars:>=1'),
           'weekly': s('created:>'+D7+'+stars:>=1'),
           'monthly':s('created:>'+D30+'+stars:>=100'),
           'hot':    s('stars:>40000'),
           'kilostar':s('created:>'+D30+'+stars:>=1000'),
           'active': s('pushed:>'+D7+'+stars:>2000'),
           'gem':    s('created:>'+D90+'+stars:500..2000'),
           'python': s(T+'language:Python'),
           'javascript': s(T+'language:JavaScript'),
           'typescript': s(T+'language:TypeScript'),
           'go':     s(T+'language:Go'),
           'rust':   s(T+'language:Rust'),
           'java':   s(T+'language:Java'),
           'swift':  s(T+'language:Swift'),
           'ai':     s('created:>'+D30+'+stars:>=50+topic:ai'),
           'security': s('created:>'+D30+'+stars:>=50+topic:security'),
           'database': s('created:>'+D30+'+stars:>=50+topic:database'),
           'devops': s('created:>'+D30+'+stars:>=50+topic:devops'),
           'gamedev': s('created:>'+D30+'+stars:>=50+topic:gamedev'),
           'tutorial': s('created:>'+D30+'+stars:>=50+topic:awesome'),
          }
          KEYS=['daily','weekly','monthly','hot','kilostar','active','gem','python','javascript','typescript','go','rust','java','swift','ai','security','database','devops','gamedev','tutorial']
          # ---------- 中文翻译（带缓存，每个仓库只翻一次） ----------
          cache={}
          if os.path.exists('trans-cache.json'):
              try: cache=json.load(open('trans-cache.json'))
              except Exception: pass
          def tr(text):
              try:
                  u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q='+urllib.parse.quote(text)
                  rq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  r=json.load(urllib.request.urlopen(rq,timeout=15))
                  out=''.join(x[0] for x in r[0] if x and x[0]).strip()
                  return out or None
              except Exception as e:
                  print('tr fail',e); return None
          seen=set(); newcnt=0
          for k in KEYS:
              for rr in boards[k]:
                  if rr['r'] in seen: continue
                  seen.add(rr['r'])
                  if not rr.get('d'): continue
                  if rr['r'] in cache:
                      rr['d']=cache[rr['r']]; continue
                  t=tr(rr['d'])
                  if t:
                      cache[rr['r']]=t; rr['d']=t[:120]; newcnt+=1; time.sleep(0.15)
          json.dump(cache,open('trans-cache.json','w'),ensure_ascii=False)
          print('translated new:',newcnt,'cached:',len(cache))
          # ---------- 排名标注 ----------
          prev={}
          if os.path.exists('snapshot-current.json'):
              old=json.load(open('snapshot-current.json'))
              for k in KEYS:
                  for i,repo in enumerate(old.get(k,[])): prev[repo['r']]=(i,k)
          def annotate(lst,key):
              names=[r['r'] for r in lst]
              for i,repo in enumerate(lst):
                  if repo['r'] in prev:
                      oi,ok=prev[repo['r']]
                      repo['c']=['up' if i<oi else 'down' if i>oi else 'flat',i-oi] if ok==key else ['new',0]
                  else: repo['c']=['new',0]
              return lst+[{'r':r,'c':['out',0]} for r,(oi,ok) in prev.items() if ok==key and r not in names]
          for k in KEYS: boards[k]=annotate(boards[k],k)
          mirrors=['https://ghproxy.net/','https://gh-proxy.com/','https://github.com/']
          idx={'updated':datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),'mirrors':mirrors}
          idx.update({k:boards[k] for k in KEYS})
          json.dump(idx,open('index.json','w'),ensure_ascii=False)
          if os.path.exists('snapshot-current.json'): shutil.copy('snapshot-current.json','snapshot-prev.json')
          json.dump(idx,open('snapshot-current.json','w'),ensure_ascii=False)
          print(' '.join(k+':'+str(len(boards[k])) for k in KEYS))
          PYEOF
      - name: commit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name radar-bot
          git config user.email actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "radar update"
          git push "https://x-access-token:${GH_TOKEN}@github.com/zzzyouyou/master321-radar.git" HEAD:main
