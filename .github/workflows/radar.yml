name: 名称: 雷达
on:触发条件:
  schedule:  计划:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:权限:
  contents:   内容: 写入
jobs:作业:
  build:  构建:
    runs-on:     运行环境: ubuntu-latest
    steps:    步骤:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {: '3.11'}with: { python-version: '3.11' }
      - name: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json,os,urllib.request,datetime,re
          TOK=os.environ.get('GH_TOKEN','')
          def api(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+TOK,'User-Agent':'radar','Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req,timeout=30))
          today=datetime.date.today()
          def search(days,minstars):
              since=(today-datetime.timedelta(days=days)).isoformat()
              try:
                  d=api(f'https://api.github.com/search/repositories?q=created:>{since}+stars:>{minstars}&sort=stars&order=desc&per_page=25')
                  return [{'r':i['full_name'],'d':(i['description'] or '')[:120],'s':i['stargazers_count'],'l':i['language'] or '','f':i['forks_count'],'i':i['open_issues_count'],'u':i['html_url']} for i in d.get('items',[])]
              除了 Exception as e:
                  print('search failed',e); return []
          # Trending 爬取做备源
          def trending(since='daily'):
              try:
                  req=urllib.request.Request(f'https://github.com/trending?since={since}',headers={'User-Agent':'Mozilla/5.0'})
                  html=urllib.request.urlopen(req,timeout=30).read().decode()
                  out=[]
                  for m,stk in re.findall(r'href="/([\w.-]+/[\w.-]+)/(?:stargazers)".*?aria-hidden[\s\S]*?([\d,]+)\s*</span>',html)[:25]:
                      pass
                  return out
              除了 Exception as e:
                  打印('趋势失败',e); 返回[]
          每日=搜索(1,30); 每周=搜索(7,80)
          如果不是每日：每日=趋势('daily')
          如果不是每周：每周=趋势('weekly')
          prev={}
          if os.path.exists('snapshot-current.json'):
              old=json.load(open('snapshot-current.json'))
              for i,repo in enumerate(old.get('daily',[])): prev[repo['r']]=(i,'daily')
              for i,repo in enumerate(old.get('weekly',[])): prev[repo['r']]=(i,'weekly')
          def 注释(列表,键):
              names=[r['r'] for r in lst]
              for i,repo in enumerate(lst):
                  if repo['r'] in prev:
                      oi,ok=prev[repo['r']]
                      if ok==key: repo['c']=('up' if i<oi else ('down' if i>oi else 'flat'),i-oi)
                      else: repo['c']=('new',0)
                  else: repo['c']=('new',0)
              return lst+[{'r':r,'c':('out',0)} for r in prev if r not in names]
          daily=annotate(daily,'daily'); weekly=annotate(weekly,'weekly')
          mirrors=['https://ghproxy.net/','https://gh-proxy.com/','https://github.com/']
          idx={'updated':datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),'mirrors':mirrors,'daily':daily,'weekly':weekly}
          json.dump(idx,open('index.json','w'),ensure_ascii=False)
          import shutil
          如果 os.path.exists('snapshot-current.json'): shutil.copy('snapshot-current.json','snapshot-prev.json')
          json.dump(idx,open('snapshot-current.json','w'),ensure_ascii=False)
          print('daily',len(daily),'weekly',len(weekly))
          EOF
      - name: commit
        run: |
          git config user.name radar-bot
          git config user.email actions@github.com
          git add index.json snapshot-current.json snapshot-prev.json
          git diff --cached --quiet || git commit -m "radar update $(date -u +%F-%H)"
          git push
